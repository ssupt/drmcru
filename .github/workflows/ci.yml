name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked

  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --check
      - name: Shellcheck privileged scripts
        # SC2154/SC1090: variables and the Limine library come from the
        # prologue that install.rs generates.
        run: shellcheck -s bash -S warning -e SC2154,SC1090 src/*.sh tests/fixtures/*.sh
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable test --locked

  portable-binary:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust and musl tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build portable binary
        run: cargo +stable build --release --locked --target x86_64-unknown-linux-musl
      - name: Prepare artifact
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          name="drmcru-${version}-x86_64-unknown-linux-musl"
          install -m 0755 "target/x86_64-unknown-linux-musl/release/drmcru" "$name"
          sha256sum "$name" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: drmcru-x86_64-linux-musl
          path: |
            drmcru-*-x86_64-unknown-linux-musl
            SHA256SUMS
          if-no-files-found: error
