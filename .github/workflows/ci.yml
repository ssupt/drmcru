name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable test --locked

  portable-binary:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and musl tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build portable binary
        run: cargo +stable build --release --locked --target x86_64-unknown-linux-musl
      - name: Prepare artifact
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          name="drmcru-${version}-x86_64-unknown-linux-musl"
          install -m 0755 "target/x86_64-unknown-linux-musl/release/drmcru" "$name"
          sha256sum "$name" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: drmcru-x86_64-linux-musl
          path: |
            drmcru-*-x86_64-unknown-linux-musl
            SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, portable-binary]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: drmcru-x86_64-linux-musl
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          binary="drmcru-${version}-x86_64-unknown-linux-musl"
          cat > /tmp/release-notes.md <<'EOF'
          Public preview of drmcru, a Linux DRM/KMS custom resolution and EDID override utility.

          Highlights:

          - CRU-style keyboard and mouse-driven TUI
          - Base EDID and CTA-861 detailed timing editing
          - DisplayID Type I timing discovery and copy support
          - Manual and calculated timing presets
          - Hyprland mode discovery, switching, and verification
          - EDID Export plus supported Limine/mkinitcpio Install, Update, and Uninstall
          - `drmcru doctor` diagnostics

          New modes require an EDID install/update and reboot. Keep a known-good display path available.
          EOF
          gh release create "$tag" "release/$binary" release/SHA256SUMS \
            --title "drmcru ${version}" \
            --prerelease \
            --notes-file /tmp/release-notes.md
